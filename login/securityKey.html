    <!-- Security Key - Credits to https://stackoverflow.com/a/45656609 -->
    <script>
        // Fallback if the CDN WebAuthn script fails to load: never leave the
        // Continue button broken with a ReferenceError.
        if (typeof checkregistration === "undefined") {
            window.checkregistration = function () {
                var m = document.getElementById("securityKeyMessage");
                if (m) {
                    m.textContent = "Security-key verification is unavailable right now — use your username and password on the login page instead.";
                    m.classList.remove("hidden");
                }
            };
        }
        try { checkregistration(); } catch (e) { /* non-fatal */ }
        if (window.history.replaceState) {
            window.history.replaceState(null, null, window.location.href);
        }
    </script>

    <style>
        html { scroll-behavior: smooth; }

        /* Animated background glow orbs */
        .glow-orb {
            position: absolute;
            border-radius: 9999px;
            filter: blur(110px);
            opacity: 0.35;
            pointer-events: none;
            animation: orb-float 12s ease-in-out infinite;
        }
        @keyframes orb-float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -40px) scale(1.15); }
        }

        /* Subtle grid backdrop */
        .grid-bg {
            background-image:
                linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
            background-size: 44px 44px;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 100%);
        }

        /* Glass cards */
        .glass-card {
            background: linear-gradient(160deg, rgba(23, 23, 33, 0.92), rgba(15, 15, 23, 0.88));
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            transition: transform .35s ease, border-color .35s ease, box-shadow .35s ease;
        }
        .glass-card:hover {
            transform: translateY(-6px);
            border-color: rgba(30, 150, 252, 0.45);
            box-shadow: 0 18px 45px -18px rgba(30, 150, 252, 0.35);
        }

        /* Gradient shimmer text */
        .shimmer-text {
            background: linear-gradient(90deg, #1e96fc, #36e2dd, #1e96fc);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shimmer 5s linear infinite;
        }
        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        /* Glowing primary button */
        .btn-glow {
            box-shadow: 0 0 0 0 rgba(30, 150, 252, 0.5);
            transition: all .3s ease;
        }
        .btn-glow:hover {
            box-shadow: 0 0 28px 2px rgba(30, 150, 252, 0.45);
            transform: translateY(-2px);
        }

        ::selection { background: rgba(30, 150, 252, 0.35); color: #fff; }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #09090d; }
        ::-webkit-scrollbar-thumb { background: #1f1f2b; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #1e96fc; }
    </style>
</head>
<body>
    <div class="fixed inset-0 -z-10 overflow-hidden">
        <div class="glow-orb w-[500px] h-[500px] bg-blue-600/40 -top-40 -left-40"></div>
        <div class="glow-orb w-[400px] h-[400px] bg-cyan-500/25 top-1/3 -right-40" style="animation-delay: -6s"></div>

    </div>

                        Client Area

                    <a href="../register" class="text-white focus:ring-0 font-medium rounded-lg text-sm px-4 py-2 lg:px-5 lg:py-2.5 mr-2 btn-glow bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 focus:outline-none focus:ring-blue-800 transition duration-200">
                        Onboard Now
                    </a>
                    <button data-collapse-toggle="mmenu" type="button" class="inline-flex items-center p-2 ml-1 text-sm text-gray-500 rounded-lg lg:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200  " aria-controls="mmenu" aria-expanded="false">
                        <span class="sr-only">Open main menu</span>
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path>
                        </svg>
                        <svg class="hidden w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">

                        </svg>
                    </button>

                        <li>
                            <a href="../" class="block py-2 pr-4 pl-3 border-b lg:hover:bg-transparent lg:border-0 lg:p-0 text-gray-400 hover:bg-gray-700 hover:text-white lg:hover:bg-transparent border-gray-700 transition duration-200" aria-current="page">Home</a>
                        </li>
                        <li>

<section>
    <div class="py-8 px-4 mx-auto max-w-screen-xl lg:py-16 grid lg:grid-cols-2 gap-8 lg:gap-16">
        <div class="flex flex-col justify-center">
            <h1 class="mb-4 text-4xl font-extrabold tracking-tight leading-none text-white-900 md:text-5xl lg:text-6xl ">Security Key Required</h1>
            <p class="mb-6 text-lg font-normal text-gray-500 lg:text-xl ">If you're using a Security Key for your KeyAuth account, you will need to insert it now to gain access.</p>
            <a href="https://t.me/keyauth" class="text-blue-600  hover:underline font-medium text-lg inline-flex items-center">Need Help? 
                <svg class="w-3.5 h-3.5 ml-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 10">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 5h12m0 0L9 1m4 4L9 9"/>
                </svg>
            </a>
        </div>
        <div>
            <div class="glass-card w-full lg:max-w-xl p-6 space-y-8 sm:p-8 rounded-2xl shadow-xl">
                <h2 class="text-2xl font-bold text-white ">
                    Insert Security Key
                </h2>
                <form method="POST" onsubmit="return false;">
                    
                    <img class="h-auto max-w-xl rounded-lg shadow-xl  " width="500px" height="500px" src="https://cdn.keyauth.cc/v3/imgs/securityKey.png" alt="Security Key">

                    <p id="securityKeyMessage" class="hidden mt-4 text-sm text-red-400 bg-red-500/10 rounded-lg px-4 py-3"></p>

                    <button type="button" onclick="checkregistration()" class="btn-glow w-full px-5 py-3 text-base font-semibold text-center text-white bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 rounded-xl sm:w-full mt-5 transition duration-200">Continue</button>
                </form>
            </div>
        </div>
    </div>
</section>

    <!--Flowbite JS-->
